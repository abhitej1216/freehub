name: freehub
description: FreeHub - Personal Free Internet Resources Directory
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Preferences
  shared_preferences: ^2.2.3

  # File management
  path_provider: ^2.1.3
  file_picker: ^8.0.7

  # Sharing
  share_plus: ^10.0.2

  # Receive sharing intents from other apps (share-target)
  receive_sharing_intent: ^1.8.1

  # Network
  http: ^1.2.1

  # URL launcher
  url_launcher: ^6.3.0

  # Icons
  cupertino_icons: ^1.0.8

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  sqflite_common_ffi: ^2.3.4+4
  sqflite_common_ffi_web: ^0.4.5+4
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/icons/
