name: Build FreeHub Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Verify Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Create Self-Contained Release Keystore
        run: |
          keytool -genkey -v \
            -keystore android/release-fallback.jks \
            -storepass "freehub123" \
            -alias "freehub" \
            -keypass "freehub123" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=FreeHub, OU=FreeHub, O=FreeHub, L=City, ST=State, C=IN"

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeHub-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-${{ github.run_id }}
          name: "FreeHub v1.0.0 (build ${{ github.run_id }})"
          body: |
            ### FreeHub v1.0.0 Android Release
            - Offline-first directory with 449 curated FMHY resources.
            - Full SQLite database backing.
            - Transactional batch catalog import.
            - Website sorting (A-Z, Newest, Popular).
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
