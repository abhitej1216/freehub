plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.freehub.freehub"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.freehub.freehub"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Sign the release build with a keystore when one is provided via
            // environment variables (KEYSTORE_PATH / KEYSTORE_PASSWORD /
            // KEY_ALIAS / KEY_PASSWORD). Otherwise fall back to the debug
            // keystore so `flutter run --release` still works locally.
            signingConfig = releaseSigningConfig

            minifyEnabled true
            proguardFiles(
                defaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )
        }
    }

    // Optional release signing configuration. The keystore is NOT committed;
    // CI injects it through secrets, and local builds fall back to debug.
    signingConfigs {
        release {
            def keystorePath = System.getenv('KEYSTORE_PATH')
            def keystorePass = System.getenv('KEYSTORE_PASSWORD')
            def keyAlias = System.getenv('KEY_ALIAS')
            def keyPass = System.getenv('KEY_PASSWORD')

            if (keystorePath && keystorePass && keyAlias && keyPass) {
                storeFile file(keystorePath)
                storePassword keystorePass
                keyAlias keyAlias
                keyPassword keyPass
            } else {
                // Fall back to the debug keystore so local release runs work.
                signingConfig = signingConfigs.debug
            }
        }
    }
}

flutter {
    source = "../.."
}
