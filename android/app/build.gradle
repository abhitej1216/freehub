plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.freehub.freehub"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.freehub.freehub"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('KEYSTORE_PATH')
            def keystorePass = System.getenv('KEYSTORE_PASSWORD')
            def keyAlias = System.getenv('KEY_ALIAS')
            def keyPass = System.getenv('KEY_PASSWORD')

            if (keystorePath && keystorePass && keyAlias && keyPass && file(keystorePath).exists()) {
                storeFile file(keystorePath)
                storePassword keystorePass
                keyAlias keyAlias
                keyPassword keyPass
            } else {
                // Generate and use a release keystore in the project root if present
                def fallbackKeystore = file("${rootDir}/release-fallback.jks")
                if (fallbackKeystore.exists()) {
                    storeFile fallbackKeystore
                    storePassword "freehub123"
                    keyAlias "freehub"
                    keyPassword "freehub123"
                } else {
                    // Fall back to debug signing config
                    initWith(signingConfigs.debug)
                }
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../../"
}
